name: Android Build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Android platform + build-tools
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle --version

      - name: Build Debug APK
        run: ./gradle-8.7/bin/gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradle-8.7/bin/gradle assembleRelease --stacktrace

      # APK именуется как <name>-<version>-<variant>.apk, например callous-1.4.0-debug.apk
      - name: Name APKs with app name and version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk       "dist/callous-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/callous-${VERSION}-release-unsigned.apk"
          ls -la dist

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: callous-debug-apk
          path: dist/callous-*-debug.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: callous-release-apk
          path: dist/callous-*-release-unsigned.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: callous-debug-apk
          path: dist

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: callous-release-apk
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk \
            --verify-tag \
            --title "CALLOUS $GITHUB_REF_NAME" \
            --generate-notes
